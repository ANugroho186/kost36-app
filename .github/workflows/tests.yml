name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Database yang sama dengan Sail (postgres:18-alpine, PostgreSQL 18.6), dikunci lewat digest
    # supaya versinya tidak berubah diam-diam. Container ini hanya hidup selama job berjalan,
    # jadi password di bawah bukan rahasia.
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # Test baru dimulai setelah PostgreSQL siap menerima koneksi. -h 127.0.0.1 memaksa cek
        # lewat jaringan: saat inisialisasi, image postgres menjalankan server sementara yang hanya
        # bisa dihubungi lewat unix socket lalu restart. Tanpa -h, cek bisa lolos terlalu cepat.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Variabel ini menimpa isi .env (yang disalin dari .env.example oleh composer setup).
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          # pdo_pgsql untuk PostgreSQL, gd + exif untuk pengolah foto (App\Support\ImageUpload).
          extensions: pdo_pgsql, gd, exif

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
